<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.2" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4338ca" flood-opacity="0.4" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <circle cx="256" cy="256" r="160" fill="url(#sun)" />
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#grad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.6" />
  <!-- Stylized Kanji '日' (Sun/Japan) with calligraphy look -->
  <g filter="url(#shadow)" fill="none" stroke="url(#grad)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical bar -->
    <path d="M 175 145 L 175 365" />
    <!-- Outer top and right -->
    <path d="M 175 145 L 337 145 C 345 145 352 152 352 160 L 352 365" />
    <!-- Center bar -->
    <path d="M 175 255 L 352 255" />
    <!-- Bottom bar -->
    <path d="M 175 365 L 352 365" />
  </g>
  <!-- Brush ink mark accent -->
  <circle cx="370" cy="135" r="14" fill="#fb7185" />
</svg>
